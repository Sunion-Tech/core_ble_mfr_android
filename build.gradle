plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace 'com.sunion.core.ble.mfr'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdk 26
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        Properties properties = new Properties()
        properties.load(project.rootProject.file('../Config/BleMFRSdk/secure.properties').newDataInputStream())
        buildConfigField "String", 'NOTIFICATION_CHARACTERISTIC', properties.getProperty("NOTIFICATION_CHARACTERISTIC")
        buildConfigField "String", 'FIRMWARE_REVISION', properties.getProperty("FIRMWARE_REVISION")
        buildConfigField "String", 'MODEL_NUMBER', properties.getProperty("MODEL_NUMBER")

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    implementation "androidx.core:core-ktx:$coreVersion"
    implementation "androidx.lifecycle:lifecycle-livedata-core:2.6.1"
    //implementation 'androidx.appcompat:appcompat:1.5.1'
    //implementation 'com.google.android.material:material:1.7.0'

    // RxJava
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.9.0"
    implementation 'com.jakewharton.rx2:replaying-share-kotlin:2.2.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // RxAndroidBLE
    implementation "com.polidea.rxandroidble2:rxandroidble:1.19.1"

    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$hilt_version"
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    // log
    implementation "com.jakewharton.timber:timber:$timber_version"

    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-rx2:1.6.4"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}